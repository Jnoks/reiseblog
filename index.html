<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiseblog</title>
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <!--HEADER START-->
    <header>
        <nav>
            <img src="./assets/icons/header-logo.svg" alt="">
            <ul>
                <li><a href=""></a>Highlights</li>
                <li><a href=""></a>FAQ</li>
                <li><a href=""></a>Contact</li>
            </ul>
        </nav>
    </header>
    <!--HEADER END-->

    <!--MAIN START-->
    <main>
        <section class="landing-section">

        </section>
        <section class="highlights-section">
            <div class="highlights-headline">
                <img src="./assets/icons/rocket-launch-yellow.svg" alt="">
                <h2>Highlights</h2>
            </div>
            <section class="slider">
                <input type="radio" name="slider" value="one" checked>
                <input type="radio" name="slider" value="two">
                <input type="radio" name="slider" value="three">
                <div class="slider-wrapper">
                    <div class="slide"></div>
                    <div class="slide"></div>
                    <div class="slide"></div>
                </div>
            </section>
        </section>
        <section class="faq-section">
            <div class="faq-headline">
                <img src="./assets/icons/live-help-yellow.svg" alt="">
                <h2>FAQ</h2>
            </div>
        </section>
        <section class="contact-section">
            <div class="contact-headline">
                <img src="./assets/icons/person-pin-yellow.svg" alt="">
                <h2>Contact form</h2>
            </div>
        </section>
    </main>
    <!--MAIN END-->

    <!--FOOTER START-->
    <footer>
        <div class="footer-left">
            <div class="copyright">
                <img src="./assets/icons/copyright-icon.svg" alt="">
                <p>Travel Blog 2026</p>
            </div>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
        <div class="footer-right">
            <a href=""><img src="./assets/icons/tiktok-icon.svg" alt=""></a>
            <a href=""><img src="./assets/icons/youtube-icon.svg" alt=""></a>
            <a href=""><img src="./assets/icons/facebook-icon.svg" alt=""></a>
            <a href=""><img src="./assets/icons/Instagram-icon.svg" alt=""></a>
        </div>
    </footer>
    <!--FOOTER END-->
</body>

</html>
