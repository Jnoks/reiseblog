<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiseblog</title>
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <!--HEADER START-->
    <header>
        <nav>
            <img src="./assets/icons/header-logo.svg" alt="">
            <ul>
                <li><a href="">Highlights</a></li>
                <li><a href="">FAQ</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!--HEADER END-->

    <!--MAIN START-->
    <main>
        <section class="landing-section">

        </section>
        <section class="highlights-section">
            <div class="highlights-headline">
                <img src="./assets/icons/rocket-launch-yellow.svg" alt="">
                <h2>Highlights</h2>
            </div>
            <section class="slider">
                <input type="radio" name="slider" id="slide-1" checked>
                <input type="radio" name="slider" id="slide-2">
                <input type="radio" name="slider" id="slide-3">

                <div class="slider-wrapper">
                    <img class="slide" src="./assets/img/beaches.jpg" alt="">
                    <img class="slide" src="./assets/img/copenhagen.jpg" alt="">
                    <img class="slide" src="./assets/img/pataya.jpg" alt="">
                </div>

                <div class="slider-dots">
                    <label for="slide-1"></label>
                    <label for="slide-2"></label>
                    <label for="slide-3"></label>
                </div>
            </section>
        </section>
        <section class="faq-section">
            <div class="faq-headline">
                <img src="./assets/icons/live-help-yellow.svg" alt="">
                <h2>FAQ</h2>
            </div>
        </section>
        <section class="contact-section">
            <div class="contact-headline">
                <img src="./assets/icons/person-pin-yellow.svg" alt="">
                <h2>Contact form</h2>
            </div>
        </section>
    </main>
    <!--MAIN END-->

    <!--FOOTER START-->
    <footer>
        <div class="footer-left">
            <div class="copyright">
                <img src="./assets/icons/copyright-icon.svg" alt="">
                <p>Travel Blog 2026</p>
            </div>
            <a href="">Cookie Preferences</a>
                <a href="">Imprint</a>

        </div>
        <div class="footer-right">
            <a href=""><img src="./assets/icons/tiktok-icon.svg" alt=""></a>
            <a class="youtube" href=""><img src="./assets/icons/youtube-icon.svg" alt=""></a>
            <a href=""><img src="./assets/icons/facebook-icon.svg" alt=""></a>
            <a href=""><img src="./assets/icons/Instagram-icon.svg" alt=""></a>
        </div>
    </footer>
    <!--FOOTER END-->
</body>

</html>
